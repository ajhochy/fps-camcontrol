atem:
  ip: 192.168.50.153
  defaultTransition: cut
  meIndex: 0
cameras:
  - id: cam1
    label: "V-BOT"
    protocol: "visca"
    cameraType: "vbot"
    inputId: 6
    viscaIp: "192.168.50.15"
    viscaPort: 52381
    cameraAddress: 1
    speedScale: 2
  - id: cam2
    label: "BirdDog 1"
    protocol: "visca"
    cameraType: "birddog"
    inputId: 7
    viscaIp: "192.168.50.16"
    viscaPort: 52381
    cameraAddress: 1
    speedScale: 0.5
  - id: cam3
    label: "BirdDog 2"
    protocol: "visca"
    cameraType: "birddog"
    inputId: 8
    viscaIp: "192.168.50.17"
    viscaPort: 52381
    cameraAddress: 1
    speedScale: 0.5

  - id: cam4
    label: "DJI RS3"
    protocol: "dji-bridge"
    inputId: 4
    bridge:
      # Hostname (mDNS) rather than a hard IP: the Pi's DHCP address changes when
      # it's moved to a different switch/port. Was 192.168.10.150, now resolves
      # to 192.168.50.151. Set a DHCP reservation if you want a fixed IP instead.
      host: "dji-bridge.local"
      port: 7878
      gimbalModel: "RS3"
      safetyTimeoutMs: 250
      rollEnabled: false

graphics:
  type: dsk
  dskIndex: 0
  uskIndex: 0
  meIndex: 0
