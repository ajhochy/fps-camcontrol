# fps-camcontrol: keep the journal across reboots so a power loss or crash leaves evidence.
# Installed to /etc/systemd/journald.conf.d/10-persistent.conf by scripts/install-pi-bridge.sh (system mode only:
# it needs sudo). Copied from bridge 1 (dji-bridge.local).
[Journal]
Storage=persistent
SystemMaxUse=200M
