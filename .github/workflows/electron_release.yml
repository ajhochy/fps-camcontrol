name: FPS Electron testing release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Testing label, for example testing-2026.10.01 (embedded app version remains 0.1.0)'
        required: true
        type: string
      qualification_only:
        description: 'Build, sign, notarize and upload both installers without publication'
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'electron-testing-*'
  pull_request:
    paths:
      - '.github/workflows/electron_release.yml'
      - '.github/electron-release-sources.json'
      - 'scripts/electron-release.cjs'
      - 'tests/release/**'

permissions:
  contents: read

concurrency:
  group: fps-electron-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.1.2'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node --test tests/release/electron-release.test.cjs scripts/test-electron-release.cjs

  plan:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      qualification_only: ${{ steps.release.outputs.qualification_only }}
      matrix: ${{ steps.release.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate testing label and pinned source commits
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          QUALIFICATION_ONLY: ${{ inputs.qualification_only }}
        run: node scripts/electron-release.cjs plan
      - name: Fail early when hosted Apple credentials are absent
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_TEAM_ID APPLE_SIGNING_IDENTITY APPLE_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Missing required hosted secret: $name"; exit 1; fi
          done
          test "$APPLE_TEAM_ID" = '56Q69NYP9H' || { echo 'Unexpected signing team'; exit 1; }
          [[ "$APPLE_SIGNING_IDENTITY" =~ ^[0-9A-Fa-f]{40}$ ]] || { echo 'Signing identity must be a full SHA-1 fingerprint'; exit 1; }

  build-macos-arm64:
    needs: plan
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      EXPECTED_SOURCE_SHA: ${{ matrix.sourceSha }}
      FPS_VARIANT: ${{ matrix.variant }}
      RELEASE_LABEL: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out exact application source from this repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ matrix.sourceSha }}
          path: source
          persist-credentials: false
      - name: Assert exact source and native arm64 tools
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(uname -m)" = arm64
          test "$(git -C source status --porcelain)" = ''
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          architecture: arm64
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.1.2'
      - name: Install frozen dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Stage pinned tracking runtime and test browser
        if: matrix.variant == 'tracking'
        working-directory: source
        run: |
          set -euo pipefail
          node scripts/stage-tracking-runtime.cjs --target "$PWD/dist/tracking-runtime" --download
          pnpm exec playwright install chromium
      - name: Run source PR checks before signing
        working-directory: source
        run: |
          set -euo pipefail
          # Tracking UI checks write fresh screenshots under this one evidence directory.
          # Exclude only new generated entries from sourceDirty provenance.
          if [ "$FPS_VARIANT" = tracking ]; then
            printf '\ndocs/ai/runs/tracking-ui-evidence/\n' >> .git/info/exclude
          fi
          node scripts/checks.cjs pr
          git diff --exit-code
          test "$(git status --porcelain)" = ''
      - name: Import Developer ID certificate into temporary keychain
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE_BASE64"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          keychain="$RUNNER_TEMP/fps-electron-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${FPS_VARIANT}.keychain-db"
          cert="$RUNNER_TEMP/fps-electron-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${FPS_VARIANT}.p12"
          list="$RUNNER_TEMP/fps-electron-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${FPS_VARIANT}.keychain-list"
          trap 'rm -f "$cert"' EXIT
          security list-keychain -d user > "$list"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$cert"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$cert" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          python3 - "$keychain" "$list" <<'PY'
          import pathlib, subprocess, sys
          keys = [line.strip().strip('"') for line in pathlib.Path(sys.argv[2]).read_text().splitlines() if line.strip()]
          subprocess.run(['security', 'list-keychain', '-d', 'user', '-s', sys.argv[1], *keys], check=True)
          PY
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
      - name: Check Apple notary credentials and imported identity
        working-directory: source
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: node scripts/sign-electron-manual.cjs --variant "$FPS_VARIANT" --check-credentials
      - name: Package and sign application
        working-directory: source
        env:
          # Public certificate fingerprint only; packaging's embedded --sign-only step uses it.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: node "scripts/package-electron-${FPS_VARIANT}.cjs"
      - name: Notarize, staple and assess final app and DMG
        working-directory: source
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ "$FPS_VARIANT" = manual ]; then app='FPS CamControl'; else app='FPS CamControl Tracking'; fi
          node scripts/sign-electron-manual.cjs --variant "$FPS_VARIANT" \
            --app "$PWD/release/$FPS_VARIANT/mac-arm64/$app.app" \
            --output-dir "$RUNNER_TEMP/fps-final-$FPS_VARIANT"
      - name: Test exact final mounted DMG
        working-directory: source
        run: |
          set -euo pipefail
          dmg="$(node -p 'require(process.argv[1]).dmg.path' "$RUNNER_TEMP/fps-final-$FPS_VARIANT/delivery.json")"
          node "scripts/test-electron-${FPS_VARIANT}-runtime.cjs" --dmg "$dmg"
      - name: Verify release receipt and stage immutable upload
        run: |
          set -euo pipefail
          node scripts/electron-release.cjs receipt \
            "$RUNNER_TEMP/fps-final-$FPS_VARIANT/delivery.json" "$FPS_VARIANT" \
            "$EXPECTED_SOURCE_SHA" "$RELEASE_LABEL" "$RUNNER_TEMP/fps-upload-$FPS_VARIANT"
      - name: Upload qualified installer and receipt
        uses: actions/upload-artifact@v4
        with:
          name: fps-${{ matrix.variant }}
          path: ${{ runner.temp }}/fps-upload-${{ matrix.variant }}/
          if-no-files-found: error
          retention-days: 14
      - name: Remove owned temporary signing keychain
        if: always()
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/fps-electron-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${FPS_VARIANT}.keychain-db"
          list="$RUNNER_TEMP/fps-electron-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${FPS_VARIANT}.keychain-list"
          if [ -f "$keychain" ]; then security delete-keychain "$keychain"; fi
          if [ -f "$list" ]; then
            python3 - "$list" <<'PY'
          import pathlib, subprocess, sys
          keys = [line.strip().strip('"') for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if line.strip()]
          subprocess.run(['security', 'list-keychain', '-d', 'user', '-s', *keys], check=True)
          PY
          fi

  publish-prerelease:
    needs: [plan, build-macos-arm64]
    if: github.event_name != 'pull_request' && needs.plan.outputs.qualification_only != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      RELEASE_LABEL: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Refuse an existing release or tag on manual dispatch
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then echo 'Release already exists'; exit 1; fi
          if [ "$GITHUB_EVENT_NAME" != push ] && git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo 'Testing tag already exists'; exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: fps-*
          path: incoming
      - name: Verify both uploads and prepare public manifest
        run: node scripts/electron-release.cjs combine incoming public "$RELEASE_LABEL"
      - name: Create one draft prerelease and upload exact assets
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --title "FPS CamControl testing $RELEASE_LABEL" --draft --prerelease --latest=false \
            --target "$GITHUB_SHA" \
            --notes "Apple Silicon testing installers for manual and tracking. Embedded app version: 0.1.0. See release-manifest.json for exact source commits, Apple receipts and SHA-256. Clean macOS/TCC, physical camera/gimbal and real-person tracking remain NOT TESTED."
          gh release upload "$RELEASE_TAG" public/*.dmg public/release-manifest.json public/SHA256SUMS --repo "$GITHUB_REPOSITORY"
      - name: Download uploaded public assets and verify bytes before publication
        run: |
          set -euo pipefail
          mkdir downloaded
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir downloaded
          node scripts/electron-release.cjs verify public/release-manifest.json downloaded
          cmp public/release-manifest.json downloaded/release-manifest.json
          cmp public/SHA256SUMS downloaded/SHA256SUMS
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
